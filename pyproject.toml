[project]
name = "corpus-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KochuthressiaPayankan", email = "148636357+KochuthressiaPayankan@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.3.0",
